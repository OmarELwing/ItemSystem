services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: itemsystem-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Admin__Password: ${ADMIN_PASSWORD}
      ConnectionStrings__MyCon: "Server=sqlserver,1433;Database=ItemSystem;User Id=sa;Password=ItemSystem@2026Strong!;TrustServerCertificate=True"

    depends_on:
      sqlserver:
        condition: service_healthy

    volumes:
      - ./SimpleProject/wwwroot/images:/app/wwwroot/images


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: itemsystem-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ItemSystem@2026Strong!"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ItemSystem@2026Strong!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  sqlserver-data: